<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al-Jadid</title>
    <style>
        /* تصميم شاشة التحميل الخلفية */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0e14; /* لون داكن مريح ومناسب للألعاب */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .splash-container {
            text-align: center;
        }

        /* اسم التطبيق */
        .app-name {
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* حالة الاتصال */
        .status-text {
            color: #8a99ad;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* تصميم دائرة التحميل الاحترافية */
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #0088cc; /* لون أزرق شبيه بتليجرام */
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="app-name">Al-Jadid</div>
        <div class="status-text">جاري الاتصال بالسيرفر بأمان...</div>
        <div class="loader"></div>
    </div>

    <script>
        // ⚠️ عندما تنقل موقعك الأسبوع القادم، قم بتغيير هذا الرابط فقط!
        const CURRENT_REPLIT_URL = "https://python--monir10m.replit.app";

        // دالة التوجيه الفوري والسريع ومسح سجل التاريخ لضمان عدم العودة للخلف بالخطأ
        function redirectToApp() {
            window.location.replace(CURRENT_REPLIT_URL);
        }

        // تنفيذ التوجيه فوراً عند تحميل الصفحة
        window.onload = redirectToApp;
    </script>
</body>
</html>
